<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>קפריסין – עוז ושרית</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e5a7a">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
<header>
  <h1>🇨🇾 לימסול <bdi dir="ltr">27–30.11</bdi></h1>
  <div id="loc" class="loc">מיקום כבוי</div>
  <div class="ver">גרסה 10<span id="syncSt"></span></div>
</header>
<div id="prompt" class="prompt" hidden></div>
<nav id="tabs"></nav>
<main id="list"></main>
<footer>
  <button id="btnLoc">📍 מיקום</button>
  <button id="btnAdapt" class="primary">🤖 התאם תוכנית</button>
  <button id="btnSet">⚙️</button>
</footer>

<dialog id="dlgMove">
  <form method="dialog">
    <h3 id="mvTitle">הזזה</h3>
    <label>יום <select id="mvDay"></select></label>
    <label>שעה <input id="mvTime" type="time"></label>
    <menu><button value="cancel">ביטול</button><button id="mvOk" value="ok" class="primary">הזז</button></menu>
  </form>
</dialog>

<dialog id="dlgAdapt">
  <form method="dialog">
    <h3>התאמת התוכנית</h3>
    <p id="adNow" class="muted"></p>
    <div class="row">
      <label>מאחרים ב-<input id="adDelay" type="number" min="5" step="5" value="30"> דקות</label>
      <button type="button" id="adShift">חשב</button>
    </div>
    <div id="adLocal"></div>
    <hr>
    <label>בקשה חופשית ל-Claude
      <textarea id="adText" rows="3" placeholder="למשל: התעייפנו, רוצים משהו רגוע וקרוב עם נוף. או: יורד גשם."></textarea>
    </label>
    <button type="button" id="adAI" class="primary">🤖 בקש הצעות מ-Claude</button>
    <div id="adStatus" class="muted"></div>
    <div id="adAIList"></div>
    <menu><button value="close">סגור</button></menu>
  </form>
</dialog>

<dialog id="dlgSet">
  <form method="dialog">
    <h3>הגדרות</h3>
    <label>מפתח Claude API (נשמר רק בטלפון הזה)<input id="stKey" type="password" autocomplete="off" placeholder="sk-ant-…"></label>
    <details><summary class="muted">מתקדם: שרת Worker במקום מפתח</summary>
      <label>כתובת שרת ה-AI (Worker)<input id="stEndpoint" type="url" placeholder="https://…workers.dev"></label>
      <label>טוקן אפליקציה (אופציונלי)<input id="stToken" type="text" autocomplete="off"></label>
    </details>
    <hr>
    <label><input id="stSim" type="checkbox"> מצב הדגמה (שעה ויום מדומים)</label>
    <div class="row">
      <select id="stSimDay"></select>
      <input id="stSimTime" type="time" value="14:00">
    </div>
    <details open><summary>🔄 סנכרון חי בין הטלפונים</summary>
      <label>כתובת שרת הסנכרון (Cloudflare Worker)<input id="syDb" type="url" placeholder="https://…workers.dev"></label>
      <label>קוד טיול (נשאר בסוד)<input id="syCode" type="text" autocomplete="off" placeholder="10–40 אותיות קטנות ומספרים"></label>
      <div class="acts"><button type="button" id="syGen">צור קוד</button><button type="button" id="syStart" class="primary">התחל סנכרון</button><button type="button" id="syStop">הפסק</button><button type="button" id="syInvite">📤 הזמן את שרית</button></div>
      <div id="syMsg" class="muted"></div>
    </details>
    <button type="button" id="stShare">📤 שלח לשרית את הרשימות והסימונים</button>
    <button type="button" id="stRefresh">🔄 רענן גרסה (לא מוחק מפתח או סימונים)</button>
    <button type="button" id="stReset" class="danger">איפוס כל הסימונים וההזזות</button>
    <menu><button value="cancel">ביטול</button><button id="stOk" value="ok" class="primary">שמור</button></menu>
  </form>
</dialog>

<script src="plan.js?v=10"></script>
<script src="logic.js?v=10"></script>
<script src="sync.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
