<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>טיול לקפריסין</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e5a7a">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=52">
</head>
<body>
<header>
  <h1>🇨🇾 לימסול <bdi dir="ltr">27–30.11</bdi></h1>
  <div id="loc" class="loc">מיקום כבוי</div>
  <div class="ver">גרסה 52<span id="syncSt"></span></div>
  <button type="button" id="simBanner" class="simbar" hidden>⚠ מצב הדגמה פעיל: השעה והיום מדומים. לחצו כדי לכבות</button>
</header>
<div id="prompt" class="prompt" hidden></div>
<nav id="tabs"></nav>
<main id="list"></main>
<div id="toast" hidden></div>
<footer>
  <button id="btnLoc">📍 מיקום</button>
  <button id="btnAdapt" class="primary">🤖 התאם תוכנית</button>
  <button id="btnSet">⚙️</button>
</footer>

<dialog id="dlgMove">
  <form method="dialog">
    <h3 id="mvTitle">עריכת פעילות</h3>
    <label>שם <input id="mvName" maxlength="120"></label>
    <label>יום <select id="mvDay"></select></label>
    <div class="row">
      <label style="flex:1">שעה <input id="mvTime" type="time"></label>
      <label style="flex:1">משך (דקות) <input id="mvDur" type="number" min="15" max="480" step="5"></label>
    </div>
    <label id="mvTypeRow">סוג
      <select id="mvType"><option value="sight">אתר / פעילות</option><option value="food">אוכל</option><option value="shop">קניות</option><option value="rest">מנוחה</option><option value="travel">נסיעה</option></select>
    </label>
    <div id="mvWarn" class="muted" style="min-height:1.3em"></div>
    <menu>
      <button value="cancel">ביטול</button>
      <button type="button" id="mvReset">↺ אפס שינויים</button>
      <button type="button" id="mvDel" class="danger">מחק</button>
      <button id="mvOk" value="ok" class="primary">שמור</button>
    </menu>
  </form>
</dialog>

<dialog id="dlgAdapt">
  <form method="dialog">
    <h3>התאמת התוכנית</h3>
    <p id="adNow" class="muted"></p>
    <div class="row">
      <label>מאחרים ב-<input id="adDelay" type="number" min="5" step="5" value="30"> דקות</label>
      <button type="button" id="adShift">חשב</button>
    </div>
    <div id="adLocal"></div>
    <hr>
    <label>בקשה חופשית ל-Claude
      <textarea id="adText" rows="3" placeholder="למשל: התעייפנו, רוצים משהו רגוע וקרוב עם נוף. או: יורד גשם."></textarea>
    </label>
    <div class="acts"><button type="button" id="adMic" class="mic" aria-label="הקלטה קולית">🎤 הקלטה</button><button type="button" id="adAI" class="primary">🤖 בקש הצעות מ-Claude</button></div>
    <div id="adStatus" class="muted"></div>
    <div id="adAIList"></div>
    <menu><button value="close">סגור</button></menu>
  </form>
</dialog>

<dialog id="dlgSet">
  <form method="dialog">
    <h3>הגדרות</h3>
    <label>מפתח Claude API (נשמר רק בטלפון הזה)<input id="stKey" type="password" autocomplete="off" placeholder="sk-ant-…"></label>
    <details><summary class="muted">מתקדם: שרת Worker במקום מפתח</summary>
      <label>כתובת שרת ה-AI (Worker)<input id="stEndpoint" type="url" placeholder="https://…workers.dev"></label>
      <label>טוקן אפליקציה (אופציונלי)<input id="stToken" type="text" autocomplete="off"></label>
    </details>
    <hr>
    <label><input id="stSim" type="checkbox"> מצב הדגמה (שעה ויום מדומים)</label>
    <div class="row">
      <select id="stSimDay"></select>
      <input id="stSimTime" type="time" value="14:00">
    </div>
    <details open><summary>🔄 סנכרון חי בין הטלפונים</summary>
      <label>כתובת שרת הסנכרון (Cloudflare Worker)<input id="syDb" type="url" placeholder="https://…workers.dev"></label>
      <label>קוד טיול (נשאר בסוד)<input id="syCode" type="text" autocomplete="off" placeholder="10–40 אותיות קטנות ומספרים"></label>
      <div class="acts"><button type="button" id="syGen">צור קוד</button><button type="button" id="syStart" class="primary">התחל סנכרון</button><button type="button" id="syStop">הפסק</button><button type="button" id="syInvite">📤 הזמן את שרית</button></div>
      <div id="syMsg" class="muted"></div>
    </details>
    <details open><summary>🔔 התראות (במכשיר הזה)</summary>
      <div class="acts"><button type="button" id="pnEnable" class="primary">הפעל התראות</button><button type="button" id="pnOff">כבה</button></div>
      <div id="pnMsg" class="muted"></div>
    </details>
    <details><summary>⏰ זמני התראות</summary>
      <label>באיזו שעה לשלוח את הודעת הבוקר<input id="ntMorning" type="time" value="08:00"></label>
      <label>התראה לפני אתר או קניות: כמה דקות לפני שצריך לצאת<input id="ntLead" type="number" min="5" max="120" step="5" inputmode="numeric"></label>
      <label>התראה לפני מסעדה שהוזמנה: כמה דקות לפני שצריך לצאת<input id="ntFood" type="number" min="5" max="120" step="5" inputmode="numeric"></label>
      <label>שאלת "הספקתם?": כמה דקות אחרי שהפעילות נגמרת<input id="ntAfter" type="number" min="0" max="120" step="5" inputmode="numeric"></label>
      <div class="acts"><button type="button" id="ntDefault">חזרה לברירות מחדל</button></div>
      <div id="ntMsg" class="muted"></div>
    </details>
    <button type="button" id="stPrint">🖨 הדפס / שמור כ-PDF (התוכנית הסופית)</button>
    <button type="button" id="stRefresh">🔄 רענן גרסה (לא מוחק מפתח או סימונים)</button>
    <button type="button" id="stReset" class="danger">איפוס כל הסימונים וההזזות</button>
    <menu><button value="cancel">ביטול</button><button id="stOk" value="ok" class="primary">שמור</button></menu>
  </form>
</dialog>

<script src="plan.js?v=52"></script>
<script src="logic.js?v=52"></script>
<script src="sync.js?v=52"></script>
<script src="push.js?v=52"></script>
<script src="app.js?v=52"></script>
<div id="printRoot"></div>
</body>
</html>
