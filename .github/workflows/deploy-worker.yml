# פריסה אוטומטית של ה-Worker ל-Cloudflare בכל שינוי בתיקיית cyprus-worker.
# סודות נדרשים ב-GitHub (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   טוקן עם הרשאת "Edit Cloudflare Workers" (כולל KV)
#   CLOUDFLARE_ACCOUNT_ID  מזהה החשבון
name: Deploy Worker
on:
  push:
    branches: [claude/cyprus-trip-app-ji9hwm]
    paths: ["cyprus-worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
concurrency: deploy-worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Cloudflare
        working-directory: cyprus-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "Missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets"; exit 1; fi
          KV_ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const n=(j.result||[]).find(x=>x.title==="cyprus-rooms");if(!n){console.error("KV namespace cyprus-rooms not found: "+s.slice(0,300));process.exit(1)}console.log(n.id)})')
          printf '\n[[kv_namespaces]]\nbinding = "ROOMS"\nid = "%s"\n' "$KV_ID" >> wrangler.toml
          npx --yes wrangler@4 deploy
